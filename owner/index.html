<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#080C15" />
  <title>BEGIN Owner — Private Analytics &amp; System Console</title>
  <link rel="icon" href="../assets/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./owner.css?v=1" />
</head>
<body>
  <div class="own-layout">
    <header class="own-topbar">
      <div class="own-brand">
        <div class="own-brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          </svg>
        </div>
        <div>
          <div class="own-brand-title">BEGIN OWNER</div>
          <div class="own-brand-sub">Private Analytics &amp; Management</div>
        </div>
      </div>

      <div class="own-topbar-actions">
        <span class="own-env-pill" id="adapterStatusPill">
          <span class="own-pulse-dot"></span>
          <span id="adapterModeLabel">Local Sandbox</span>
        </span>
        <button type="button" class="own-btn own-btn-ghost" id="exportSnapshotBtn" title="Unduh JSON Snapshot">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Export JSON</span>
        </button>
        <a href="../" class="own-btn own-btn-emerald">
          <span>Buka App</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
        </a>
      </div>
    </header>

    <div class="own-body">
      <nav class="own-nav" id="ownerNav" aria-label="Modul Owner Console"></nav>
      <main class="own-main" id="ownerMain"></main>
    </div>
  </div>

  <div class="own-toast" id="ownerToast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=1"></script>
</body>
</html>
